name: Refresh runtime history and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Optional history length to refresh (days)"
        required: false
        type: string

concurrency:
  group: runtime-dashboard
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Refresh workflow history
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BACKFILL_DAYS: ${{ inputs.backfill_days }}
        run: |
          if [ -n "$BACKFILL_DAYS" ]; then
            node scripts/collect.ts --days "$BACKFILL_DAYS"
          else
            node scripts/collect.ts
          fi
      - name: Preserve collected history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/workflow.json
          if ! git diff --cached --quiet; then
            git commit -m "Update workflow runtime history"
            git push
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
